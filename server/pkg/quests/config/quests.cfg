Elem Settings
{
	// Сколько секунд торговец не выдаёт новую посылку.
	MerchantCooldown	1800
	// Сколько секунд стражник не выдаёт новое задание.
	GuardCooldown		1800

	// Базовая плата за посылку: MinGold + бросок GoldDice.
	MinGold			100
	GoldDice		3d75

	// Во сколько раз платят больше за доставку в другой город.
	CrossTownMultiplier	5

	// Награда за голову монстра.
	GuardMinGold		200
	GuardMaxGold		500
}

