// Корабль-паром капитана. ObjType'ы кораблей в ModernDistro лежат в
// pkg/multis/itemdesc.cfg, но этот файл не входит ни в один загружаемый
// пакет, поэтому Boat-дескрипторы не регистрировались и
// CreateMultiAtLocation() отвечал "not a Multi".
// MultiID ссылается на определение корпуса из config/multis.cfg.

Boat 0x11010
{
	Name		FerryBoat
	MultiID		0x0010
}
